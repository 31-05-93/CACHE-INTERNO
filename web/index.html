document.addEventListener('submit',e=>{if(!['recordForm','closureForm','configForm'].includes(e.target.id))return;e.preventDefault();const next=structuredClone(state),data=Object.fromEntries(new FormData(e.target));if(e.target.id==='recordForm'){const{k,id}=editing;if(k==='okr'){toast('Los OKR se guardan en el módulo compartido.');return}const index=id?next.modules[k].records.findIndex(r=>(r.Folio||r.ID)===id):-1,old=index>=0?next.modules[k].records[index]:{},r={...old,...data};const idField=k==='urgencias'||k==='incidencias'?'Folio':'ID';r[idField]=id||(k==='urgencias'?'URG':k==='incidencias'?'INC':k==='monday'?'MON':'OKR')+'-WEB-'+crypto.randomUUID().slice(0,8).toUpperCase();r['Ultima edicion']=now();r['Ultima actualizacion']=now();r['Usuario ultima edicion']='Control web';if(!id)r['Alta en sistema']=now();if(k==='urgencias'){if(r['Mes de reporte'])r['Mes de reporte']+='-01T00:00:00';Object.assign(r,measure(r))}if(k==='monday'){r.Fecha=String(r.Fecha||'').slice(0,10);r.Hora=obraTime(r.Hora);if(r['Metraje avanzado']!=='')r['Metraje avanzado']=Number(r['Metraje avanzado']);}if(k==='okr'){for(const f of ['Realizado','Meta','Avance actividades','Ponderacion','Ano'])r[f]=Number(r[f]||0);if(r.Ponderacion>1||r['Avance actividades']>100){toast('Ponderación debe estar entre 0 y 1; avance entre 0 y 100.');return}r.Progreso=r.Tipo==='Actividades'?r['Avance actividades']/100:r.Meta>0?r.Realizado/r.Meta:0;r['Resultado ponderado']=r.Progreso*r.Ponderacion}if(index>=0)next.modules[k].records[index]=r;else next.modules[k].records.push(r);log(next,id?'Actualización':'Alta',r[idField],r['Proyecto/obra']||r.Proyecto||r['Objetivo OKR']);if(persist(next)){$('#modal').close();render();toast('Registro guardado en este navegador.')}}if(e.target.id==='closureForm'){const c={...data,actualizacion:now()},i=next.closures.findIndex(x=>x.periodo===c.periodo);if(i>=0)next.closures[i]=c;else next.closures.push(c);log(next,'Cierre mensual',c.periodo,c.conclusion);if(persist(next))toast('Cierre me function okrPage(){if(!okrData){if(!okrLoading&&!okrError)setTimeout(refreshOkrs,0);return head('Objetivos y resultados clave','Seguimiento mensual por departamento.')+`<section class="panel"><div class="empty">${okrError?esc(okrError):'Cargando información compartida…'}</div>${okrError?'<button data-okr="refresh">Intentar de nuevo</button>':''}</section>`}const admin=okrAdmin(),role=admin?'Administrador':okrData.user.role==='department'?'Usuario de departamento':'Solo consulta';if(!okrDept)return head('OKR por departamento','Objetivos, avances y resultados del equipo.',`<button data-go="company-analysis">${icon('resumen')} Análisis de la empresa</button>${admin?'<button class="primary" data-okr="department">＋ Nuevo departamento</button>':''}`)+`<div class="section-label">Departamentos</div>${departmentCards(admin)}`;const dep=okrData.departments.find(d=>d.id===okrDept),p=okrPeriod(),rows=okrRows(),weight=rows.reduce((a,o)=>a+o.weight,0),total=rows.reduce((a,o)=>a+o.weighted,0),periods=okrData.periods.filter(p=>p.department_id===okrDept).sort((a,b)=>a.period.localeCompare(b.period));return head('OKR · '+esc(dep.name),'Metas, avances e historial mensual del departamento.',`<button data-okr="back">← Departamentos</button><button data-okr="refresh">Actualizar</button>${admin?'<button class="primary" data-okr="period">＋ Nuevo mes</button>':''}`)+`<section class="panel"><div class="filters"><label>Departamento<select id="okrDepartment">${okrData.departments.map(d=>`<option value="${esc(d.id)}" ${d.id===okrDept?'selected':''}>${esc(d.name)}</option>`).join('')}</select></label><label>Mes de seguimiento<select id="okrMonth">${periods.length?periods.map(x=>`<option value="${x.period}" ${x.period===okrMonth?'selected':''}>${monthLabel(x.period)}</option>`).join(''):'<option>Sin periodos</option>'}</select></label>${p?badge(p.closed?'Mes cerrado':'Mes abierto'):''}${admin&&p?`<button data-okr="toggle">${p.closed?'Reabrir mes':'Cerrar mes'}</button>`:''}${p?'<button data-okr="csv">Exportar CSV</button>':''}</div></section>${annualPanel()}${p?`<div class="cards">${card('Resultado del mes',pct(total),'Suma de resultados ponderados')}${card('Resultados clave',rows.length,'Objetivos definidos para este mes')}${card('Ponderación total',pct(weight),Math.abs(weight-1)<.000001?'Distribución completa':'Debe sumar 100% para cerrar')}${card('Periodo',p.closed?'Cerrado':'Abierto',p.closed?'Historial protegido':'Captura de avances disponible')}</div>${p.closed?'<div class="notice">Este mes está cerrado. Los administradores pueden corregir porcentajes de avance; los objetivos permanecen protegidos hasta reabrir el mes.</div>':''}${Math.abs(weight-1)>.000001?'<div class="notice">Las ponderaciones todavía no suman 100%. El resultado mensual es provisional.</div>':''}<section class="panel" style="margin-top:22px"><div class="panelhead"><div><h2 id="okrObjectivesHeading" tabindex="-1">Objetivos del mes</h2><p>Progreso = realizado ÷ meta · Resultado ponderado = progreso × ponderación</p></div>${admin&&!p.closed?'<button class="primary" data-okr="objective">＋ Nuevo resultado clave</button>':''}</div>${rows.length?`${okrObjectiveTable(rows,p)}`:'<div class="empty">Este mes todavía no tiene objetivos. El administrador puede agregarlos.</div>'}</section>`:`<section class="panel"><div class="empty">Este departamento aún no tiene meses registrados.${admin?' Usa Nuevo mes para iniciar.':''}</div></section>`}<section class="panel"><h2>Historial mensual</h2><p>Conserva los objetivos y el resultado de cada periodo.</p><div class="table-wrap"><table><thead><tr><th>Mes</th><th>Resultados clave</th><th>Resultado mensual</th><th>Estado</th><th></th></tr></thead><tbody>${[...periods].reverse().map(x=>{const rs=okrData.objectives.filter(o=>o.department_id===okrDept&&o.period===x.period);return `<tr><td>${monthLabel(x.period)}</td><td>${rs.length}</td><td>${pct(rs.reduce((a,o)=>a+o.weighted,0))}</td><td>${badge(x.closed?'Mes cerrado':'Mes abierto')}</td><td><button data-ok function okrModal(action,id){if(!okrData)return;if(!['progress','detail'].includes(action)&&!okrAdmin()){toast('Esta acción corresponde al administrador.');return}const o=id?okrData.objectives.find(o=>o.id===id):null;if(action==='progress'&&(!o||!okrCanProgress(o))){toast('No tienes permiso para capturar este avance.');return}if(action==='objective'&&(!okrPeriod()||okrPeriod().closed)){toast('Selecciona un mes abierto.');return}let title='',content='';if(action==='detail'){if(!o)return;const total=okrRows().reduce((sum,r)=>sum+r.weighted,0);$('#modal').innerHTML=`<div class="modalhead"><div><div class="eyebrow">CACHÉ · OKR · ${monthLabel(o.period)}</div><h2>Detalle del resultado clave</h2></div><button data-action="close" aria-label="Cerrar">✕</button></div><div class="modalbody"><h2>${esc(o.title)}</h2><p>${esc(o.kr)}</p><div class="cards" style="margin-top:22px">${card('Realizado',o.type==='percentage'?pct(o.achieved):o.achieved,'Avance guardado')}${card('Progreso',pct(o.progress),'Realizado ÷ meta')}${card('Resultado',pct(o.weighted),'Progreso × ponderación')}${card('Resultado global',pct(total),'Suma de resultados del mes')}</div><p>Meta: ${o.type==='percentage'?pct(o.target):esc(o.target)} · Ponderación: ${pct(o.weight)}</p><div class="detailbox" style="margin-top:18px">${esc(o.notes||'Sin actividades adicionales registradas.')}</div><p style="white-space:pre-wrap;margin-top:15px">${esc(o.comments||'Sin comentarios de avance.')}</p></div><div class="modalfoot"><button data-action="close">Cerrar</button></div>`;$('#modal').showModal();return}const depOptions=okrData.departments.map(d=>`<option value="${d.id}" ${d.id===okrDept?'selected':''}>${esc(d.name)}</option>`).join('');if(action==='progress'){title='Capturar avance';content=`<div class="wide"><strong>${esc(o.title)}</strong><p>${esc(o.kr)}</p><div class="notice">Meta: ${o.type==='percentage'?pct(o.target):esc(o.target)}. ${o.type==='percentage'?'Captura un porcentaje entre 0 y 100.':'Captura la cantidad re const okrDrafts=new Map();

ion><option ${cxcCurrency==='MXN'?'selected':''}>MXN</option><option ${cxcCurrency==='USD'?'selected':''}>USD</option></select><button data-ledger="clear">Limpiar</button></div><div id="cxcRows">${cxcRowsTable(rows)}</div><p class="meta" id="cxcRowCount" style="margin-top:16px">${rows.length} cuentas mostradas</p></section><div class="notice">Los totales corresponden a las cuentas mostradas y se actualizan con los filtros. Fuera del corte se usa el último importe disponible; las referencias sin importe se señalan en las tarjetas. El estado de seguimiento es editable y se conserva al importar. La ausencia en un PDF no significa que esté pagado. Los importes muestran el corte original, incluso al marcar Pagado. Los comentarios se guardan como actualizaciones independientes. Los comentarios originales del Excel no tienen fecha histórica identificada. Los totales suman las filas: pueden diferir unos centavos de los subtotales impresos por redondeo.</div><section class="panel cxc-cut"><div class="filters"><label>Corte del reporte<select id="cxcSnapshot">${cxcData.reports.map(r=>`<option value="${r.id}" ${r.id===cxcSnapshot?'selected':''}>${esc(r.report_date)} · ${esc(r.name)}</option>`).join('')}</select></label><a class="source-link" href="/api/cxc/source?report=${encodeURIComponent(cxcSnapshot)}" target="_blank" rel="noopener">Ver PDF original ↗</a><a class="source-link" href="/api/cxc/source?kind=excel" target="_blank" rel="noopener">Excel de comentarios ↗</a><button data-ledger="csv">Exportar CSV</button></div><p class="meta">${cxcData.accounts.length} cuentas del PDF · Corte ${esc(report.report_date)} · Los importes se conservan como aparecen en el sistema.</p></section><div class="actions" style="justify-content:flex-end;margin:20px 0"><button data-cxc-back>← Reportes de CxC</button><button data-ledger="refresh">Actualizar</button>${cxcData.can_write?'<button class="primary" data-ledger="import">＋ Importar PDF</button>':''}</div>`}
function cxcRowsTable(rows){if(!rows.length)return '<div class="empty">No hay cuentas que coincidan con los filtros.</div>';return `<div class="table-wrap"><table class="ledger-table"><thead><tr><th>Vendedor</th><th>Cliente / proyecto</th><th>Pedido</th><th>Tipo</th><th>Moneda</th><th>Total</th><th>Facturado</th><th>Pagado</th><th>Saldo</th><th>Estado de seguimiento</th><th>Actualizaciones</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.vendor||'—')}</td><td class="ledger-client"><strong>${esc(r.client)}</strong><p>${esc(r.project)}</p></td><td><button class="linkbtn" data-cxc-account="${esc(r.id)}">${esc(r.order_number)}</button></td><td>${esc(r.type)}</td><td>${esc(r.currency)}</td>${['total_cents','invoiced_cents','paid_cents','balance_cents'].map(k=>`<td class="ledger-amount ${k==='balance_cents'?'ledger-balance':''}">${cxcMoney(r[k],r.currency)}</td>`).join('')}<td>${cxcStatusControl(r)}</td><td><button class="update-button" data-cxc-account="${esc(r.id)}" aria-label="Abrir actualizaciones del pedido ${esc(r.order_number)}">${icon('bitacora')}<span>${r.updates_count||0}</span> Abrir</button></td></tr>`).join('')}</tbody></table></div>`}
function cxcStatusControl(r){return (cxcData.can_write?`<div class="cxc-state"><select data-cxc-state="${esc(r.id)}" aria-label="Estado del pedido ${esc(r.order_number)}"><option value="" ${!r.status_override?'selected':''}>Según PDF: ${esc(r.source_status||r.status||'Por revisar')}</option>${['COBRABLE','TRÁNSITO','PAGADO'].map(v=>`<option value="${v}" ${r.status_override===v?'selected':''}>${v==='PAGADO'?'Pagado':v==='COBRABLE'?'Cobrable':'Tránsito'}</option>`).join('')}</select><button data-cxc-save-state="${esc(r.id)}" aria-label="Guardar estado del pedido ${esc(r.order_number)}">Guardar</button></div>`:badge(r.status||'Por revisar'))+`<small class="meta">${r.status_override?'Estado manual · ':''}${r.source_report_date?'Último dato: '+esc(r.source_report_date):'Referencia Excel'}</small>`}
function ledgerAccount(){return [...(cxcData?.accounts||[]),...(cxcData?.outside||[])].find(r=>r.id===cxcAccount)}
async function openCxcUpdates(id,append=false){const row=[...(cxcData?.accounts||[]),...(cxcData?.outside||[])].find(r=>r.id===id);if(!row)return;if(cxcUpdatesLoading)return;cxcUpdatesLoading=true;if(!append){cxcAccount=id;cxcEntries=[];cxcCursor=null;cxcNoteRequest=null;drawCxcUpdates(true)}try{const d=await cxcRequest('/updates?account='+encodeURIComponent(id)+(append&&cxcCursor?'&cursor='+encodeURIComponent(cxcCursor):''));if(cxcAccount!==id)return;cxcEntries=append?[...cxcEntries,...d.entries]:d.entries;cxcCursor=d.next_cursor;drawCxcUpdates(false)}catch(e){toast(e.message);if(!append)drawCxcUpdates(false,e.message)}finally{cxcUpdatesLoading=false}}
function drawCxcUpdates(loading=false,error=''){const r=ledgerAccount();if(!r)return;const previous=$('#cxcUpdateBody')?.value||'';$('#modal').innerHTML=`<div class="modalhead"><div><div class="eyebrow">CXC · ACTUALIZACIONES</div><h2>Pedido ${esc(r.order_number)} · ${esc(r.currency)}</h2><p>${esc(r.client)} · ${esc(r.project)}</p></div><button data-action="close" aria-label="Cerrar actualizaciones">✕</button></div><div class="modalbody updates-body"><div class="account-summary"><div><span>Vendedor</span><strong>${esc(r.vendor||'—')}</strong></div><div><span>Saldo</span><strong>${cxcMoney(r.balance_cents,r.currency)}</strong></div><div><span>Estado</span>${badge(r.status||'Por revisar')}</div></div><details class="account-data"><summary>Datos de la cuenta y contacto</summary><div class="formgrid" style="margin-top:15px">${[['Fecha del pedido',r.date],['Fecha cobrable',r.collectible_date],['Días reportados',r.days],['Concepto',r.concept],['Entrega / instalación',r.delivery],['Contacto',r.contact],['Teléfono',r.phone],['Correo',r.email]].map(([k,v])=>`<div><span class="meta">${k}</span><p>${esc(v??'—')}</p></div>`).join('')}</div></details>${cxcData.can_write?`<form id="cxcUpdateForm" class="update-composer"><label>Escribir una actualización<textarea id="cxcUpdateBody" name="body" maxlength="5000" required placeholder="Agrega un comentario, acuerdo o seguimiento…">${esc(previous)}</textarea></label><div><span class="meta">Se guardará con tu nombre y la fecha actual.</span><button class="primary" type="submit">Publicar actualización</button></div></form>`:'<div class="notice">Puedes consultar el historial. CxC y administradores pueden publicar actualizaciones.</div>'}<div class="update-section-label">Historial de actualizaciones</div><div id="updatesTimeline">${loading?'<div class="empty">Cargando actualizaciones…</div>':error?`<div class="notice">${esc(error)}</div>`:cxcEntries.length?cxcEntries.map(n=>`<article class="update-entry"><div class="update-entry-header"><span class="update-avatar">${esc(n.author_label?.slice(0,1).toUpperCase()||'C')}</span><div><strong>${esc(n.author_label)}</strong><p class="meta">${n.posted_at?new Date(n.posted_at).toLocaleString('es-MX',{timeZone:'America/Mexico_City'}):'Comentario importado del Excel · fecha original no disponible'}${n.source==='excel'?` · Hoja ${esc(n.source_sheet)}, fila ${n.source_row}`:''}</p></div></div><div class="update-text">${esc(n.body)}</div></article>`).join(''):'<div class="empty">Todavía no hay actualizaciones. El primer comentario iniciará el historial.</div>'}</div>${cxcCursor?'<button data-ledger="older">Cargar actualizaciones anteriores</button>':''}</div>`;if(!$('#modal').open)$('#modal').showModal()}
async function cxcImportFile(file){if(!file)return;if(file.size>3*1024*1024){toast('El PDF debe ser de hasta 3 MB.');return}toast('Leyendo y validando el PDF…');try{const bytes=new Uint8Array(await file.arrayBuffer()),pdfjs=await import('/assets/cxc-pdf.mjs');pdfjs.GlobalWorkerOptions.workerSrc='/assets/cxc-pdf.worker.mjs';const pdf=await pdfjs.getDocument({data:bytes.slice(),useSystemFonts:true}).promise;if(pdf.numPages>100)throw Error('El reporte debe tener hasta 100 páginas.');const pages=[];for(let i=1;i<=pdf.numPages;i++){const p=await pdf.getPage(i),t=await p.getTextContent();pages.push({height:p.getViewport({scale:1}).height,items:t.items})}const parsed=cxcParsePages(pages);await pdf.destroy();cxcPdfPreview={...parsed,file,bytes};$('#modal').innerHTML=`<div class="modalhead"><div><div class="eyebrow">CXC · IMPORTACIÓN</div><h2>Revisar nuevo corte</h2></div><button data-action="close" aria-label="Cerrar">✕</button></div><div class="modalbody"><p>${esc(file.name)}</p><div class="cards" style="margin-top:20px">${card('Cuentas detectadas',parsed.accounts.length,'Pedidos únicos del PDF')}${card('Saldo MXN',cxcMoney(parsed.accounts.filter(r=>r.currency==='MXN').reduce((s,r)=>s+r.balance_cents,0),'MXN'),'Sin conversión')}${card('Saldo USD',cxcMoney(parsed.accounts.filter(r=>r.currency==='USD').reduce((s,r)=>s+r.balance_cents,0),'USD'),'Sin conversión')}</div><label>Fecha del reporte<input type="date" id="cxcImportDate" value="${parsed.report_date}" required></label><div class="notice">Los subtotales del PDF fueron verificados. Este corte se guardará sin reemplazar cortes anteriores ni comentarios. Las cuentas se vinculan por pedido, tipo y moneda.</div></div><div class="modalfoot"><button data-action="close">Cancelar</button><button class="primary" data-ledger="confirm-import">Importar corte</button></div>`;$('#modal').showModal()}catch(e){toast('No se pudo importar: '+e.message)}}
function cxcExport(){const fields=['Vendedor','Cliente','Proyecto','Pedido','Tipo','Moneda','Total','Facturado','Pagado','Saldo','Estado','Actualizaciones'],safe=v=>'"'+String(v??'').replace(/^[=+@-]/,"'$&").replaceAll('"','""'),rows=cxcFiltered().map(r=>[r.vendor,r.client,r.project,r.order_number,r.type,r.currency,...['total_cents','invoiced_cents','paid_cents','balance_cents'].map(k=>r[k]==null?'':r[k]/100),r.status,r.updates_count]);download('Reporte_CxC_'+(cxcData.reports.find(r=>r.id===cxcSnapshot)?.report_date||today())+'.csv','\uFEFF'+[fields,...rows].map(r=>r.map(safe).join(',')).join('\r\n'),'text/csv;charset=utf-8')}
document.addEventListener('click',async e=>{if(e.target.closest('[data-cxc-all-states]')){cxcStatus=[];document.querySelectorAll('[data-cxc-filter-state]').forEach(input=>input.checked=false);cxcUpdateFilteredRows();return}const filter=$('#cxcStatusFilter');if(filter&&!filter.contains(e.target))filter.open=false;const save=e.target.closest('[data-cxc-save-state]');if(save){const id=save.dataset.cxcSaveState,row=[...cxcData.accounts,...cxcData.outside].find(r=>r.id===id),select=save.parentElement.querySelector('[data-cxc-state]');save.disabled=true;try{await cxcRequest('/status',{account_id:id,status:select.value||null,version:row.status_version});await refreshCxc();toast('Estado guardado en el historial.')}catch(error){toast(error.message);save.disabled=false}return}const b=e.target.closest('[data-ledger]'),account=e.target.closest('[data-cxc-account]'),scope=e.target.closest('[data-ledger-scope]');if(account)openCxcUpdates(account.dataset.cxcAccount);if(scope){cxcScope=scope.dataset.ledgerScope;cxcVendor=cxcQuery=cxcCurrency='';cxcStatus=[];render()}if(!b)return;const a=b.dataset.ledger;if(a==='refresh')refreshCxc();if(a==='import')$('#cxcPdfInput').click();if(a==='clear'){cxcVendor=cxcQuery=cxcCurrency='';cxcStatus=[];render()}if(a==='older')openCxcUpdates(cxcAccount,true);if(a==='csv')cxcExport();if(a==='confirm-import'&&cxcPdfPreview){b.disabled=true;try{const p=cxcPdfPreview,date=$('#cxcImportDate').value;let binary='';for(let i=0;i<p.bytes.length;i+=32768)binary+=String.fromCharCode(...p.bytes.subarray(i,i+32768));const result=await cxcRequest('/import',{name:p.file.name,report_date:date,accounts:p.accounts,checks:p.checks,pdf_base64:btoa(binary)});cxcSnapshot=result.id;if(cxcReport==='proyeccion-presupuesto'){projectionPdf=result.id;projectionDirty=false;await refreshProjection()}cxcScope='all';cxcVendor=cxcQuery=cxcCurrency='';cxcStatus=[];cxcPdfPreview=null;$('#modal').close();await refreshCxc();toast(result.reused?'Este PDF ya estaba importado. Se abrió su corte.':'Corte importado. Se conservaron las cuentas, estados y comentarios anteriores.')}catch(e){toast(e.message);b.disabled=false}}});
document.addEventListener('input',e=>{if(e.target.id==='cxcSearch'){cxcQuery=e.target.value;cxcUpdateFilteredRows()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#cxcStatusFilter')?.open){$('#cxcStatusFilter').open=false;$('#cxcStatusFilter').querySelector('summary').focus()}});
document.addEventListener('change',e=>{if(e.target.id==='cxcPdfInput')cxcImportFile(e.target.files[0]);if(e.target.id==='cxcSnapshot'){cxcSnapshot=e.target.value;refreshCxc()}if(e.target.matches('[data-cxc-filter-state]')){cxcStatus=e.target.checked?[...new Set([...cxcStatus,e.target.value])]:cxcStatus.filter(v=>v!==e.target.value);cxcUpdateFilteredRows()}if(['cxcVendor','cxcCurrency'].includes(e.target.id)){if(e.target.id==='cxcVendor')cxcVendor=e.target.value;if(e.target.id==='cxcCurrency')cxcCurrency=e.target.value;cxcUpdateFilteredRows()}});
document.addEventListener('submit',async e=>{if(e.target.id!=='cxcUpdateForm')return;e.preventDefault();const form=e.target,button=form.querySelector('[type="submit"]'),body=form.querySelector('textarea').value.trim();if(!body)return;if(!cxcNoteRequest||cxcNoteRequest.account_id!==cxcAccount||cxcNoteRequest.body!==body)cxcNoteRequest={id:crypto.randomUUID(),account_id:cxcAccount,body};button.disabled=true;try{await cxcRequest('/update',cxcNoteRequest);cxcNoteRequest=null;$('#cxcUpdateBody').value='';await openCxcUpdates(cxcAccount);await refreshCxc();toast('Actualización publicada y guardada en el historial.')}catch(e){toast(e.message);button.disabled=false}});


let projectionData=null,projectionLoading=false,projectionError='',projectionMonth='',projectionPdf='',projectionSales='',projectionVendor='',projectionQuery='',projectionChosen={},projectionMapping={},projectionDirty=false,salesPreview=null;
async function refreshProjection(){if(projectionLoading)return;projectionLoading=true;projectionError='';try{const params=new URLSearchParams();if(projectionMonth)params.set('month',projectionMonth);if(projectionPdf)params.set('pdf',projectionPdf);if(projectionSales)params.set('sales',projectionSales);projectionData=await cxcRequest('/projection?'+params);projectionMonth=projectionData.period;projectionPdf=projectionData.pdf_report_id;projectionSales=projectionData.sales_report_id;projectionChosen=Object.fromEntries(projectionData.selections.map(s=>[s.account_id,s.amount_cents]));projectionMapping={...projectionData.mappings};projectionDirty=false}catch(e){projectionError=e.message}finally{projectionLoading=false;if(page==='cxc'&&cxcReport==='proyeccion-presupuesto')render()}}
function projectionVendorKey(row){return projectionMapping[row.vendor]||'Sin relación · '+row.vendor}
function projectionAccounts(){return projectionData.accounts.filter(r=>(!projectionVendor||projectionVendorKey(r)===projectionVendor)&&(!projectionQuery||[r.order_number,r.client,r.project,r.vendor].join(' ').toLowerCase().includes(projectionQuery.toLowerCase())))}
function projectionNumbers(vendor=projectionVendor){const sales=projectionData.rows.filter(r=>!vendor||r.vendor===vendor),accounts=projectionData.accounts.filter(r=>!vendor||projectionVendorKey(r)===vendor),selected=accounts.filter(r=>Object.hasOwn(projectionChosen,r.id)),result={};for(const currency of ['MXN','USD']){const list=selected.filter(r=>r.currency===currency),salesRows=projectionData.currency===currency?sales:[];result[currency]={orders:projectionData.currency===currency&&salesRows.some(r=>r.orders_cents!==null)?salesRows.reduce((s,r)=>s+(r.orders_cents||0),0):null,budget:projectionData.currency===currency&&salesRows.some(r=>r.budget_cents!==null)?salesRows.reduce((s,r)=>s+(r.budget_cents||0),0):null,amount:list.reduce((s,r)=>s+projectionChosen[r.id],0),count:list.length,missing:salesRows.filter(r=>r.orders_cents===null).length};result[currency].percentage=result[currency].orders>0?result[currency].amount/result[currency].orders:null}return result}
function projectionCards(){const currency=projectionData.currency,n=projectionNumbers()[currency],other=currency==='MXN'?'USD':'MXN',extra=projectionNumbers()[other],label=projectionVendor||'Toda la empresa';return `<div class="cards projection-cards">${card('Pedidos del mes · '+currency,cxcMoney(n.orders,currency),esc(label)+(n.missing?' · '+n.missing+' vendedores sin pedidos registrados':''))}${card('Meta de venta · '+currency,cxcMoney(n.budget,currency),'Presup. del reporte de ventas')}${card('Cobranza proyectada · '+currency,cxcMoney(n.amount,currency),n.count+' partidas seleccionadas')}${card('Cobranza / pedidos',n.percentage===null?'—':pct(n.percentage),'Importe seleccionado ÷ pedidos del mes')}</div><div class="projection-equation"><span>De <strong>${cxcMoney(n.orders,currency)}</strong> en pedidos del mes, proyectamos cobrar <strong>${cxcMoney(n.amount,currency)}</strong>.</span><small>${extra.count?`También ${cxcMoney(extra.amount,other)} en ${extra.count} partidas · sin conversión ni comparación con ${currency}.`:'Los importes en MXN y USD se mantienen separados.'}</small></div>`}
function projectionRowsTable(){const accounts=projectionAccounts();if(!accounts.length)return '<div class="empty">No hay partidas con estos filtros.</div>';return `<div class="table-wrap"><table class="ledger-table projection-table"><thead><tr><th>Cobrar</th><th>Vendedor del PDF</th><th>Cliente / proyecto</th><th>Pedido</th><th>Moneda</th><th>Saldo del PDF</th><th>A cobrar</th><th>Estado</th></tr></thead><tbody>${accounts.map(r=>{const picked=Object.hasOwn(projectionChosen,r.id);return `<tr class="${picked?'projection-picked':''}"><td><input type="checkbox" data-projection-pick="${esc(r.id)}" aria-label="Incluir pedido ${esc(r.order_number)} en cobranza" ${picked?'checked':''} ${!projectionData.can_write||r.balance_cents<=0?'disabled':''}></td><td>${esc(r.vendor)}<small class="meta">Ventas: ${esc(projectionMapping[r.vendor]||'Sin relación')}</small></td><td class="ledger-client"><strong>${esc(r.client)}</strong><p>${esc(r.project)}</p></td><td>${esc(r.order_number)} · ${esc(r.type)}</td><td>${esc(r.currency)}</td><td class="ledger-amount">${cxcMoney(r.balance_cents,r.currency)}</td><td><input type="number" data-projection-amount="${esc(r.id)}" aria-label="Importe a cobrar del pedido ${esc(r.order_number)}" step="0.01" min="0.01" max="${r.balance_cents/100}" value="${picked?(projectionChosen[r.id]/100).toFixed(2):''}" placeholder="Sin seleccionar" ${!picked||!projectionData.can_write?'disabled':''}></td><td>${badge(r.tracking_status||r.status)}${picked&&r.tracking_status==='PAGADO'?'<small class="meta">Revisa si aún debe incluirse.</small>':''}</td></tr>`}).join('')}</tbody></table></div>`}
function projectionSummaryTable(){const names=[...new Set([...projectionData.rows.map(r=>r.vendor),...projectionData.accounts.map(projectionVendorKey)])].sort();return `<div class="table-wrap"><table><thead><tr><th>Vendedor</th><th>Meta ${projectionData.currency}</th><th>Pedidos ${projectionData.currency}</th><th>A cobrar MXN</th><th>A cobrar USD</th><th>Cobranza / pedidos</th></tr></thead><tbody>${names.filter(name=>!projectionVendor||name===projectionVendor).map(name=>{const totals=projectionNumbers(name),n=totals[projectionData.currency],missing=name.startsWith('Sin relación · ');return `<tr><td>${esc(name)}</td><td>${missing?'—':cxcMoney(n.budget,projectionData.currency)}</td><td>${missing?'—':cxcMoney(n.orders,projectionData.currency)}</td><td>${cxcMoney(totals.MXN.amount,'MXN')}</td><td>${cxcMoney(totals.USD.amount,'USD')}</td><td>${missing||n.percentage===null?'—':pct(n.percentage)}</td></tr>`}).join('')}</tbody></table></div>`}
function projectionPage(){if(!projectionData){if(!projectionLoading&&!projectionError)setTimeout(refreshProjection,0);return head('Proyección de presupuesto','Pedidos del mes y cobranza esperada.','',false)+`<section class="panel"><p>${projectionError?esc(projectionError):'Cargando ventas y partidas del PDF…'}</p>${projectionError?'<button data-projection="refresh">Intentar nuevamente</button>':''}</section>`}const data=projectionData,names=[...new Set([...data.rows.map(r=>r.vendor),...data.accounts.map(projectionVendorKey)])].sort(),salesReport=data.sales_reports.find(r=>r.id===projectionSales),savedDate=data.updated_at?new Date(data.updated_at).toLocaleString('es-MX',{timeZone:'America/Mexico_City'}):'';return head('Proyección de presupuesto','Selecciona las partidas que esperan cobrar y compáralas con los pedidos del mes.','',false)+`<section class="panel projection-controls"><div class="filters"><label>Mes de proyección<select id="projectionMonth">${[...new Set([...data.months,projectionMonth,...data.history.map(r=>r.period)])].sort().reverse().map(month=>`<option value="${month}" ${month===projectionMonth?'selected':''}>${monthLabel(month)}</option>`).join('')}</select></label><label>Vendedor<select id="projectionVendor"><option value="">Toda la empresa</option>${names.map(name=>`<option value="${esc(name)}" ${name===projectionVendor?'selected':''}>${esc(name)}</option>`).join('')}</select></label><span class="meta">${projectionDirty?'Cambios sin guardar':savedDate?'Guardado · '+esc(savedDate):'Proyección nueva · sin selección'}</span>${data.can_write?`<button class="primary" data-projection="save" ${projectionLoading||!data.rows.length?'disabled':''}>Guardar proyección</button>${projectionDirty?'<button data-projection="undo">Descartar cambios</button>':''}`:''}</div></section><div id="projectionCards">${projectionCards()}</div>${!data.rows.length?'<div class="notice">El archivo de ventas no tiene datos para este mes. Importa el reporte correspondiente para guardar la proyección.</div>':''}<section class="panel"><div class="panelhead"><div><h2>Partidas de cobranza</h2><p>Marca una partida para incluir su saldo o escribe el importe del pago parcial.</p></div></div><div class="filters"><input id="projectionSearch" type="search" value="${esc(projectionQuery)}" placeholder="Buscar pedido, cliente o proyecto…" aria-label="Buscar partidas">${data.can_write?'<button data-projection="select-visible">Seleccionar visibles</button><button data-projection="clear-visible">Quitar visibles</button>':''}<span class="meta">${Object.keys(projectionChosen).length} partidas seleccionadas en la proyección</span></div><div id="projectionRows">${projectionRowsTable()}</div></section><section class="panel"><h2>Resumen por vendedor</h2><p>Comparación de pedidos y cobranza seleccionada. Las partidas pueden corresponder a pedidos de meses anteriores.</p><div id="projectionSummary">${projectionSummaryTable()}</div></section><section class="panel cxc-cut"><h2>Archivos y cortes</h2><div class="filters" style="margin-top:18px"><label>PDF de CxC<select id="projectionPdf">${data.pdf_reports.map(r=>`<option value="${r.id}" ${r.id===projectionPdf?'selected':''}>${esc(r.report_date)} · ${esc(r.name)}</option>`).join('')}</select></label><label>Reporte de ventas<select id="projectionSales">${data.sales_reports.map(r=>`<option value="${r.id}" ${r.id===projectionSales?'selected':''}>${esc(r.name)} · ${r.currency}</option>`).join('')}</select></label><a class="source-link" href="/api/cxc/source?report=${encodeURIComponent(projectionPdf)}" target="_blank" rel="noopener">Ver PDF ↗</a><a class="source-link" href="/api/cxc/sales-source?sales=${encodeURIComponent(projectionSales)}">Descargar ventas ↗</a>${data.can_write?'<button data-projection="import-pdf">＋ Importar PDF</button><button data-projection="import-sales">＋ Importar ventas</button>':''}<button data-projection="export">Exportar proyección</button></div><p class="meta">Ventas en ${esc(salesReport?.currency||data.currency)} · Datos de Presup. y Real Pedidos de la hoja ${esc(data.rows[0]?.source_sheet||'sin datos')} · Los campos vacíos no se interpretan como ventas registradas.</p><details class="account-data" style="margin-top:20px"><summary>Relación de vendedores entre el PDF y ventas</summary><p>Verifica las coincidencias sugeridas. Las partidas sin relación aparecen aparte.</p><div class="projection-mappings">${[...new Set(data.accounts.map(r=>r.vendor))].sort().map(v=>`<label>${esc(v)}<select data-projection-map="${esc(v)}" ${!data.can_write?'disabled':''}><option value="">Sin relación</option>${data.rows.map(r=>`<option value="${esc(r.vendor)}" ${projectionMapping[v]===r.vendor?'selected':''}>${esc(r.vendor)}</option>`).join('')}</select></label>`).join('')}</div></details></section>${data.history.length?`<section class="panel"><h2>Proyecciones guardadas</h2><div class="table-wrap"><table><thead><tr><th>Mes</th><th>PDF</th><th>Ventas</th><th>Último guardado</th><th></th></tr></thead><tbody>${data.history.map(h=>`<tr><td>${monthLabel(h.period)}</td><td>${esc(data.pdf_reports.find(r=>r.id===h.pdf_report_id)?.name||h.pdf_report_id)}</td><td>${esc(data.sales_reports.find(r=>r.id===h.sales_report_id)?.name||h.sales_report_id)}</td><td>${new Date(h.updated_at).toLocaleString('es-MX',{timeZone:'America/Mexico_City'})}</td><td><button data-projection-history="${esc(h.id)}">Consultar</button></td></tr>`).join('')}</tbody></table></div></section>`:''}<div class="actions" style="justify-content:flex-end;margin:20px 0"><button data-cxc-back>← Reportes de CxC</button><button data-projection="refresh">Actualizar</button></div><input type="file" id="projectionPdfInput" accept="application/pdf,.pdf" hidden><input type="file" id="projectionSalesInput" accept=".xlsx" hidden>`}
function projectionChanged(){projectionDirty=true;render()}
function projectionSwitchAllowed(){if(projectionDirty){toast('Guarda o descarta los cambios antes de cambiar de mes o archivo.');render();return false}return true}
async function projectionSalesFile(file){if(!file)return;try{toast('Revisando reporte de ventas…');const bytes=new Uint8Array(await file.arrayBuffer()),reader=await import('/assets/sales-xlsx-v1.mjs'),sheets=await reader.readSalesWorkbook(bytes);salesPreview={bytes,file,sheets};const year=Number(today().slice(0,4)),parsed=reader.parseSalesSheets(sheets,year);$('#modal').innerHTML=`<div class="modalhead"><div><div class="eyebrow">CXC · VENTAS</div><h2>Importar reporte de ventas</h2></div><button data-action="close">✕</button></div><div class="modalbody"><p>${esc(file.name)}</p><p>${parsed.rows.length} registros · ${parsed.months.length} meses · Hoja ${esc(parsed.source_sheet)}</p><div class="formgrid"><label>Año del reporte<input id="salesImportYear" type="number" min="2000" max="2100" value="${year}"></label><label>Moneda<select id="salesImportCurrency"><option>MXN</option><option>USD</option></select></label></div><div class="notice">Se usarán Presup. y Real Pedidos de la hoja con más meses registrados. El archivo original y las proyecciones anteriores se conservan.</div></div><div class="modalfoot"><button data-action="close">Cancelar</button><button class="primary" data-projection="confirm-sales">Importar ventas</button></div>`;$('#modal').showModal()}catch(e){toast(e.message)}}
function projectionExport(){const rows=projectionData.accounts.filter(r=>Object.hasOwn(projectionChosen,r.id)&&(!projectionVendor||projectionVendorKey(r)===projectionVendor)),header=['Mes','Vendedor PDF','Vendedor ventas','Pedido','Tipo','Moneda','Saldo PDF','A cobrar'],data=rows.map(r=>[projectionMonth,r.vendor,projectionMapping[r.vendor]||'',r.order_number,r.type,r.currency,r.balance_cents/100,projectionChosen[r.id]/100]),safe=v=>'"'+String(v??'').replace(/^[=+@-]/,"'$&").replaceAll('"','""')+'"';download('Proyeccion_Cobranza_'+projectionMonth+'.csv','\uFEFF'+[header,...data].map(row=>row.map(safe).join(',')).join('\r\n'),'text/csv;charset=utf-8')}
document.addEventListener('change',async e=>{const target=e.target;if(target.id==='projectionPdfInput'){await cxcImportFile(target.files[0]);return}if(target.id==='projectionSalesInput'){await projectionSalesFile(target.files[0]);return}if(target.id==='projectionVendor'){projectionVendor=target.value;render()}if(['projectionMonth','projectionPdf','projectionSales'].includes(target.id)&&projectionSwitchAllowed()){if(target.id==='projectionMonth')projectionMonth=target.value;if(target.id==='projectionPdf')projectionPdf=target.value;if(target.id==='projectionSales'){projectionSales=target.value;projectionMonth=''}projectionVendor='';await refreshProjection()}if(target.matches('[data-projection-pick]')){const id=target.dataset.projectionPick,row=projectionData.accounts.find(r=>r.id===id);if(target.checked)projectionChosen[id]=row.balance_cents;else delete projectionChosen[id];projectionChanged()}if(target.matches('[data-projection-amount]')){const id=target.dataset.projectionAmount,row=projectionData.accounts.find(r=>r.id===id),value=Number(target.value),cents=Math.round(value*100);if(!Number.isFinite(value)||cents<1||cents>row.balance_cents){toast('El importe debe ser mayor a cero y no exceder el saldo del PDF.');render();return}projectionChosen[id]=cents;projectionChanged()}if(target.matches('[data-projection-map]')){projectionMapping[target.dataset.projectionMap]=target.value;projectionVendor='';projectionChanged()}});
document.addEventListener('input',e=>{if(e.target.id==='projectionSearch'){projectionQuery=e.target.value;$('#projectionRows').innerHTML=projectionRowsTable()}});
document.addEventListener('click',async e=>{const history=e.target.closest('[data-projection-history]');if(history&&projectionSwitchAllowed()){const h=projectionData.history.find(h=>h.id===history.dataset.projectionHistory);projectionMonth=h.period;projectionPdf=h.pdf_report_id;projectionSales=h.sales_report_id;projectionVendor='';await refreshProjection()}const b=e.target.closest('[data-projection]');if(!b)return;const action=b.dataset.projection;if(action==='save'){b.disabled=true;try{const result=await cxcRequest('/projection-save',{period:projectionMonth,pdf_report_id:projectionPdf,sales_report_id:projectionSales,version:projectionData.version,selections:Object.entries(projectionChosen).map(([account_id,amount_cents])=>({account_id,amount_cents})),mappings:projectionMapping});projectionData.version=result.version;projectionDirty=false;await refreshProjection();toast('Proyección guardada.')}catch(e){toast(e.message);b.disabled=false}}if(action==='refresh'&&projectionSwitchAllowed())refreshProjection();if(action==='undo'){projectionChosen=Object.fromEntries(projectionData.selections.map(s=>[s.account_id,s.amount_cents]));projectionMapping={...projectionData.mappings};projectionDirty=false;render()}if(action==='select-visible'){for(const row of projectionAccounts())if(row.balance_cents>0&&row.tracking_status!=='PAGADO')projectionChosen[row.id]=row.balance_cents;projectionChanged()}if(action==='clear-visible'){for(const row of projectionAccounts())delete projectionChosen[row.id];projectionChanged()}if(action==='import-pdf'&&projectionSwitchAllowed())$('#projectionPdfInput').click();if(action==='import-sales'&&projectionSwitchAllowed())$('#projectionSalesInput').click();if(action==='export')projectionExport();if(action==='confirm-sales'&&salesPreview){b.disabled=true;try{const year=Number($('#salesImportYear').value),currency=$('#salesImportCurrency').value;if(!Number.isInteger(year)||year<2000||year>2100)throw Error('Año inválido.');const reader=await import('/assets/sales-xlsx-v1.mjs'),parsed=reader.parseSalesSheets(salesPreview.sheets,year);let binary='';for(let i=0;i<salesPreview.bytes.length;i+=32768)binary+=String.fromCharCode(...salesPreview.bytes.subarray(i,i+32768));const result=await cxcRequest('/sales-import',{year,currency,name:salesPreview.file.name,rows:parsed.rows,xlsx_base64:btoa(binary)});projectionSales=result.id;projectionMonth=parsed.months.sort().at(-1);projectionDirty=false;projectionVendor='';salesPreview=null;$('#modal').close();await refreshProjection();toast(result.reused?'Este reporte de ventas ya estaba importado.':'Ventas importadas.')}catch(e){toast(e.message);b.disabled=false}}});


let clientsData=null,clientsLoading=false,clientsError='',clientsQuery='',clientsVendor='',clientsStatus='',clientsEditing='',clientDraftId='';
const clientLabels={status:'Estado',vendor:'Vendedor',client:'Cliente',project:'Proyecto',address:'Dirección',admin_contact:'Contacto administrativo',admin_phone:'Teléfono administrativo',site_contact:'Contacto en obra',site_phone:'Teléfono en obra',qr:'Acceso QR',badge:'Gafete',purchase_order:'O.C.',contract:'Contrato',estimate:'Estimación',siroc:'SIROC',repse:'REPSE',advance:'Anticipo',credit:'Crédito',credit_limit:'Límite de crédito',currency:'Moneda',comments:'Comentarios'},clientRequirements=['qr','badge','purchase_order','contract','estimate','siroc','repse'];
async function refreshClients(){if(clientsLoading)return;clientsLoading=true;clientsError='';try{clientsData=await cxcRequest('/clients')}catch(e){clientsError=e.message}finally{clientsLoading=false;if(page==='cxc'&&cxcReport==='relacion-clientes')render()}}
function clientsFiltered(){return clientsData.records.filter(r=>(!clientsVendor||r.vendor===clientsVendor)&&(!clientsStatus||r.status===clientsStatus)&&(!clientsQuery||[r.client,r.project,r.vendor,r.admin_contact,r.site_contact,r.address,r.comments].join(' ').toLowerCase().includes(clientsQuery.toLowerCase())))}
function clientsRows(){const rows=clientsFiltered();return rows.length?`<div class="table-wrap"><table class="ledger-table"><thead><tr><th>Estado</th><th>Vendedor</th><th>Cliente / proyecto</th><th>Contacto administrativo</th><th>Condiciones</th><th>Comentarios</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr><td>${badge(r.status||'Sin dato')}</td><td>${esc(r.vendor)}</td><td class="ledger-client"><strong>${esc(r.client)}</strong><p>${esc(r.project)}</p></td><td>${esc(r.admin_contact||'—')}<p>${esc(r.admin_phone||'—')}</p></td><td><p>Anticipo: ${esc(r.advance||'—')}</p><p>Crédito: ${esc(r.credit||'—')}</p><p>Límite: ${esc(r.credit_limit||'—')} ${esc(r.currency)}</p></td><td class="client-comment">${esc(r.comments||'—')}</td><td><button data-client-open="${esc(r.id)}">Ver ficha</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No hay clientes que coincidan con los filtros.</div>'}
function clientsPage(){if(!clientsData){if(!clientsLoading&&!clientsError)setTimeout(refreshClients,0);return head('Relación clientes','Contactos, condiciones de pago y requisitos por proyecto.','',false)+`<section class="panel"><p>${clientsError?esc(clientsError):'Cargando relación de clientes…'}</p>${clientsError?'<button data-clients="refresh">Intentar nuevamente</button>':''}</section>`}return head('Relación clientes','Contactos, condiciones de pago y requisitos por proyecto.','',false)+`<section class="panel"><div class="panelhead"><div><h2>Clientes y proyectos</h2><p>${clientsData.records.length} registros · ${new Set(clientsData.records.map(r=>r.client)).size} nombres de cliente</p></div>${clientsData.can_write?'<button class="primary" data-clients="new">＋ Nuevo registro</button>':''}</div><div class="filters"><input id="clientsSearch" type="search" placeholder="Buscar cliente, proyecto o contacto…" value="${esc(clientsQuery)}" aria-label="Buscar clientes"><select id="clientsVendor" aria-label="Vendedor"><option value="">Todos los vendedores</option>${[...new Set(clientsData.records.map(r=>r.vendor))].sort().map(v=>`<option ${clientsVendor===v?'selected':''}>${esc(v)}</option>`).join('')}</select><select id="clientsStatus" aria-label="Estado del cliente"><option value="">Todos los estados</option>${[...new Set(clientsData.records.map(r=>r.status).filter(Boolean))].sort().map(v=>`<option ${clientsStatus===v?'selected':''}>${esc(v)}</option>`).join('')}</select><button data-clients="clear">Limpiar</button></div><div id="clientsRows">${clientsRows()}</div><p class="meta" id="clientsCount" style="margin-top:16px">${clientsFiltered().length} registros mostrados</p></section><section class="panel cxc-cut"><div class="filters"><a class="source-link" href="/api/cxc/clients-source">Descargar Excel original ↗</a><button data-clients="export">Exportar relación</button></div><p class="meta">Fuente: ${esc(clientsData.source_name)}. Se conservaron los campos vacíos y las marcas originales de requisitos.</p></section><div class="actions" style="justify-content:flex-end;margin:20px 0"><button data-cxc-back>← Reportes de CxC</button><button data-clients="refresh">Actualizar</button></div>`}
function openClient(id='',editing=false){const r=clientsData.records.find(r=>r.id===id)||{};clientsEditing=id;if(!id)clientDraftId=crypto.randomUUID();const edit=clientsData.can_write&&(editing||!id);$('#modal').innerHTML=`<div class="modalhead"><div><div class="eyebrow">CXC · CLIENTES</div><h2>${esc(r.client||'Nuevo cliente / proyecto')}</h2><p>${esc(r.project||'Contactos y requisitos')}</p></div><button data-action="close" aria-label="Cerrar ficha">✕</button></div><form id="clientForm"><div class="modalbody"><div class="formgrid">${Object.entries(clientLabels).filter(([k])=>!clientRequirements.includes(k)).map(([key,label])=>`<label ${['comments','address'].includes(key)?'class="full"':''}>${label}${edit?['comments','address'].includes(key)?`<textarea name="${key}" maxlength="5000">${esc(r[key]||'')}</textarea>`:`<input name="${key}" value="${esc(r[key]||'')}" maxlength="500" ${['client','project','vendor'].includes(key)?'required':''}>`:`<p class="client-detail-value">${esc(r[key]||'—')}</p>`}</label>`).join('')}</div><div class="update-section-label" style="margin-top:24px">Requisitos del cliente / obra</div><div class="projection-mappings">${clientRequirements.map(key=>`<label>${clientLabels[key]}${edit?`<select name="${key}">${[...new Set(['','✔','❌','X',r[key]||''])].map(v=>`<option value="${esc(v)}" ${v===(r[key]||'')?'selected':''}>${esc(v||'Sin dato')}</option>`).join('')}</select>`:`<strong class="client-detail-value">${esc(r[key]||'Sin dato')}</strong>`}</label>`).join('')}</div>${edit?'<p class="meta" style="margin-top:20px">Usa % o días cuando corresponda en anticipo y crédito. Las marcas de requisitos se conservan literalmente.</p>':''}${r.source_sheet?`<p class="meta" style="margin-top:15px">Origen: ${esc(r.source_sheet)}, fila ${r.source_row}</p>`:''}</div><div class="modalfoot"><button type="button" data-action="close">Cerrar</button>${edit?'<button type="submit" class="primary">Guardar registro</button>':clientsData.can_write?`<button type="button" data-client-edit="${esc(r.id)}">Editar ficha</button>`:''}</div></form>`;$('#modal').showModal()}
function clientsExport(){const fields=Object.keys(clientLabels),safe=v=>'"'+String(v??'').replace(/^[=+@-]/,"'$&").replaceAll('"','""')+'"';download('Relacion_clientes.csv','\uFEFF'+[fields.map(k=>clientLabels[k]),...clientsFiltered().map(r=>fields.map(k=>r[k]))].map(row=>row.map(safe).join(',')).join('\r\n'),'text/csv;charset=utf-8')}
document.addEventListener('click',e=>{const open=e.target.closest('[data-client-open]'),edit=e.target.closest('[data-client-edit]'),b=e.target.closest('[data-clients]');if(open)openClient(open.dataset.clientOpen);if(edit)openClient(edit.dataset.clientEdit,true);if(!b)return;if(b.dataset.clients==='new')openClient();if(b.dataset.clients==='refresh')refreshClients();if(b.dataset.clients==='export')clientsExport();if(b.dataset.clients==='clear'){clientsQuery=clientsVendor=clientsStatus='';render()}});
document.addEventListener('input',e=>{if(e.target.id==='clientsSearch'){clientsQuery=e.target.value;$('#clientsRows').innerHTML=clientsRows();$('#clientsCount').textContent=clientsFiltered().length+' registros mostrados'}});
document.addEventListener('change',e=>{if(e.target.id==='clientsVendor')clientsVendor=e.target.value;if(e.target.id==='clientsStatus')clientsStatus=e.target.value;if(['clientsVendor','clientsStatus'].includes(e.target.id)){ $('#clientsRows').innerHTML=clientsRows();$('#clientsCount').textContent=clientsFiltered().length+' registros mostrados'}});
document.addEventListener('submit',async e=>{if(e.target.id!=='clientForm')return;e.preventDefault();const b=e.target.querySelector('button[type="submit"]');if(!b)return;b.disabled=true;try{const record=Object.fromEntries(new FormData(e.target)),old=clientsData.records.find(r=>r.id===clientsEditing);await cxcRequest('/clients-save',{id:old?.id||clientDraftId,version:old?.version||0,record});$('#modal').close();await refreshClients();toast('Registro de cliente guardado.')}catch(e){toast(e.message);b.disabled=false}});

readNavigation();render();if(page!=='okr')setTimeout(refreshOkrs,0);
</script></body></html>
